<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planner Banchi 3BES</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#dfe5ee;--accent:#2f6fed;--shadow:0 10px 28px rgba(30,55,90,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1280px;margin:0 auto;padding:24px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:29px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
button{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 13px;border-radius:10px;font-weight:650;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.title-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px}
.title-box label{display:block;font-size:13px;font-weight:700;color:#344054;margin-bottom:8px}
.title-box input{width:100%;border:1px solid #ccd4df;background:#f8fafc;border-radius:10px;padding:12px 10px;font-size:16px;color:#172033;outline:none}
.title-box input:focus{border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.print-sheet{background:#fff;border:1px solid #d6ddea;border-radius:18px;padding:28px;box-shadow:var(--shadow);aspect-ratio:297 / 210;display:flex;flex-direction:column;justify-content:flex-start}
.sheet-title{text-align:center;font-size:32px;font-weight:800;margin:0 0 20px;color:#172033;min-height:38px;word-break:break-word}
.classroom{background:#eef2f8;border:1px solid #d6ddea;border-radius:18px;padding:26px;flex:1}
.teacher{width:min(460px,90%);margin:0 auto 26px;background:#253858;color:white;text-align:center;padding:12px 18px;border-radius:14px;font-weight:800;letter-spacing:.04em;font-size:18px}
.row{display:grid;grid-template-columns:110px repeat(3,1fr);gap:16px;align-items:stretch;margin-bottom:16px}
.row:last-child{margin-bottom:0}
.row-label{display:flex;justify-content:center;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;font-weight:800;color:#344054;min-height:126px;font-size:15px}
.desk{background:#fff;border:1px solid #dfe5ee;border-radius:16px;padding:14px;min-height:126px;box-shadow:0 4px 12px rgba(30,55,90,.05)}
.desk-head{font-size:14px;color:#667085;font-weight:800;margin-bottom:10px;text-align:center}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
input.seat-input{width:100%;border:1px solid #ccd4df;background:#f8fafc;border-radius:10px;padding:11px 9px;font-size:15px;line-height:1.2;color:#172033;outline:none;text-align:center;font-weight:650;min-height:44px}
input.seat-input:focus{border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.export-seat{width:100%;min-height:44px;border:1px solid #ccd4df;background:#f8fafc;border-radius:10px;padding:8px 7px;font-size:15px;line-height:1.2;color:#172033;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:650;overflow:visible;white-space:normal;word-break:break-word}
@media(max-width:900px){
  .wrap{padding:12px}
  .top{flex-direction:column;gap:12px}
  h1{font-size:24px}
  .sub{font-size:13px}
  .actions{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .actions button{width:100%;padding:12px 8px;font-size:13px}
  .print-sheet{padding:12px;aspect-ratio:auto}
  .sheet-title{font-size:24px;margin-bottom:12px;min-height:30px}
  .classroom{padding:12px}
  .teacher{margin-bottom:14px;font-size:16px}
  .row{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
  .row-label{grid-column:1/-1;min-height:auto;padding:8px;font-size:13px}
  .desk{min-height:126px;padding:9px}
  .desk-head{font-size:12px}
  .seats{grid-template-columns:1fr;gap:7px}
  input.seat-input,.export-seat{font-size:14px;min-height:42px}
}
@media(max-width:600px){
  .actions{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .row-label{grid-column:1}
  .desk{min-height:auto}
  .seats{grid-template-columns:1fr 1fr;gap:8px}
  input.seat-input,.export-seat{font-size:15px;min-height:44px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Planner Banchi 3BES</h1>
      <div class="sub">Scrivi liberamente i nomi nei posti, aggiungi un titolo e salva la disposizione.</div>
    </div>
    <div class="actions">
      <button id="resetBtn">Azzera</button>
      <button id="saveBtn">Salva disposizione</button>
      <button id="loadBtn">Ripristina salvata</button>
      <button class="primary" id="imageBtn">Salva come immagine</button>
    </div>
  </div>

  <div class="title-box">
    <label for="titleInput">Titolo sopra la cattedra</label>
    <input id="titleInput" type="text" placeholder="Es. Sistemazione banchi 3BES - novembre">
  </div>

  <div class="print-sheet" id="printSheet">
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="classroom">
      <div class="teacher">CATTEDRA</div>
      <div id="rows"></div>
    </div>
  </div>
</div>

<script>
const state=Array.from({length:12},()=>["",""]);
let customTitle="";

function render(){
  document.getElementById('sheetTitle').textContent=customTitle || '';
  const rows=document.getElementById('rows');
  rows.innerHTML='';
  for(let r=0;r<4;r++){
    const row=document.createElement('div');
    row.className='row';

    const label=document.createElement('div');
    label.className='row-label';
    label.textContent=(r+1)+'ª fila';
    row.appendChild(label);

    for(let c=0;c<3;c++){
      const di=r*3+c;
      const desk=document.createElement('div');
      desk.className='desk';
      desk.innerHTML='<div class="desk-head">Bancata '+(c+1)+'</div><div class="seats"></div>';
      const seats=desk.querySelector('.seats');

      for(let si=0;si<2;si++){
        const input=document.createElement('input');
        input.className='seat-input';
        input.type='text';
        input.placeholder='';
        input.value=state[di][si];
        input.autocomplete='off';
        input.addEventListener('input',()=>{state[di][si]=input.value});
        seats.appendChild(input);
      }
      row.appendChild(desk);
    }
    rows.appendChild(row);
  }
}

function sanitizeFileName(str){
  return (str || '')
    .trim()
    .replace(/[\\/:*?"<>|]/g,'')
    .replace(/\s+/g,' ')
    .slice(0,120);
}

document.getElementById('titleInput').addEventListener('input',e=>{
  customTitle=e.target.value;
  document.getElementById('sheetTitle').textContent=customTitle;
});

document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('Azzerare tutta la disposizione?')) return;
  for(let i=0;i<12;i++) state[i]=['',''];
  customTitle='';
  localStorage.removeItem('planner3bes-free');
  localStorage.removeItem('planner3bes-free-title');
  document.getElementById('titleInput').value='';
  render();
};

document.getElementById('saveBtn').onclick=()=>{
  localStorage.setItem('planner3bes-free',JSON.stringify(state));
  localStorage.setItem('planner3bes-free-title',customTitle);
  const btn=document.getElementById('saveBtn');
  const old=btn.textContent;
  btn.textContent='Salvato';
  setTimeout(()=>btn.textContent=old,1000);
};

document.getElementById('loadBtn').onclick=()=>{
  try{
    const saved=JSON.parse(localStorage.getItem('planner3bes-free'));
    const savedTitle=localStorage.getItem('planner3bes-free-title') || '';
    if(Array.isArray(saved)&&saved.length===12){
      for(let i=0;i<12;i++){
        state[i]=Array.isArray(saved[i])?[saved[i][0]||'',saved[i][1]||'']:['',''];
      }
    }
    customTitle=savedTitle;
    document.getElementById('titleInput').value=customTitle;
    render();
  }catch(e){}
};

document.getElementById('imageBtn').onclick=async()=>{
  const target=document.getElementById('printSheet');
  const btn=document.getElementById('imageBtn');
  const old=btn.textContent;
  btn.textContent='Creo immagine...';
  btn.disabled=true;

  try{
    const shot=await html2canvas(target,{backgroundColor:'#ffffff',scale:2,useCORS:true,onclone:(doc)=>{
      doc.querySelectorAll('#printSheet input.seat-input').forEach(input=>{
        const replacement=doc.createElement('div');
        replacement.className='export-seat';
        replacement.textContent=input.value.trim();
        input.replaceWith(replacement);
      });
    }});

    const finalCanvas=document.createElement('canvas');
    finalCanvas.width=3508;
    finalCanvas.height=2480;
    const ctx=finalCanvas.getContext('2d');

    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,finalCanvas.width,finalCanvas.height);

    const margin=100;
    const maxW=finalCanvas.width-margin*2;
    const maxH=finalCanvas.height-margin*2;

    const ratio=Math.min(maxW/shot.width,maxH/shot.height);
    const drawW=shot.width*ratio;
    const drawH=shot.height*ratio;
    const x=(finalCanvas.width-drawW)/2;
    const y=(finalCanvas.height-drawH)/2;

    ctx.drawImage(shot,x,y,drawW,drawH);

    const titleName=sanitizeFileName(customTitle);
    const fileName=(titleName || 'banchi-a4-orizzontale') + '.png';

    const a=document.createElement('a');
    a.download=fileName;
    a.href=finalCanvas.toDataURL('image/png');
    a.click();
  }catch(e){
    alert("Non sono riuscito a creare l'immagine.");
  }

  btn.textContent=old;
  btn.disabled=false;
};

render();
</script>
</body>
</html>
