<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planner Banchi 3BES</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#dfe5ee;--accent:#2f6fed;--shadow:0 10px 28px rgba(30,55,90,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:28px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
button{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 13px;border-radius:10px;font-weight:650;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.classroom{background:#eef2f8;border:1px solid #d6ddea;border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.teacher{width:min(420px,90%);margin:0 auto 24px;background:#253858;color:white;text-align:center;padding:11px 16px;border-radius:12px;font-weight:800;letter-spacing:.04em}
.row{display:grid;grid-template-columns:100px repeat(3,1fr);gap:14px;align-items:stretch;margin-bottom:14px}
.row-label{display:flex;justify-content:center;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;font-weight:800;color:#344054;min-height:118px}
.desk{background:#f5d7ad;border:2px solid #b98550;border-radius:16px;padding:12px;min-height:118px;box-shadow:0 6px 14px rgba(91,61,30,.08)}
.desk-head{font-size:12px;color:#6f4d2f;font-weight:800;margin-bottom:9px;text-align:center}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{width:100%;border:1px solid #c9b08f;background:rgba(255,255,255,.94);border-radius:10px;padding:11px 9px;font-size:14px;color:#172033;outline:none;text-align:center;font-weight:650}
input:focus{border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
@media(max-width:900px){
  .wrap{padding:12px}
  .top{flex-direction:column;gap:12px}
  h1{font-size:24px}
  .sub{font-size:13px}
  .actions{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .actions button{width:100%;padding:12px 8px;font-size:13px}
  .classroom{padding:12px}
  .teacher{margin-bottom:14px}
  .row{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
  .row-label{grid-column:1/-1;min-height:auto;padding:8px;font-size:13px}
  .desk{min-height:126px;padding:9px}
  .desk-head{font-size:11px}
  .seats{grid-template-columns:1fr;gap:7px}
  input{font-size:14px;padding:10px 8px}
}
@media(max-width:600px){
  .actions{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .row-label{grid-column:1}
  .desk{min-height:auto}
  .seats{grid-template-columns:1fr 1fr;gap:8px}
  input{font-size:15px;padding:11px 8px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Planner Banchi 3BES</h1>
      <div class="sub">Scrivi liberamente i nomi nei posti e salva la disposizione.</div>
    </div>
    <div class="actions">
      <button id="resetBtn">Azzera</button>
      <button id="saveBtn">Salva disposizione</button>
      <button id="loadBtn">Ripristina salvata</button>
      <button class="primary" id="imageBtn">Salva come immagine</button>
    </div>
  </div>

  <div class="classroom">
    <div class="teacher">CATTEDRA</div>
    <div id="rows"></div>
  </div>
</div>

<script>
const state=Array.from({length:12},()=>["",""]);

function render(){
  const rows=document.getElementById('rows');
  rows.innerHTML='';
  for(let r=0;r<4;r++){
    const row=document.createElement('div');
    row.className='row';

    const label=document.createElement('div');
    label.className='row-label';
    label.textContent=(r+1)+'ª fila';
    row.appendChild(label);

    for(let c=0;c<3;c++){
      const di=r*3+c;
      const desk=document.createElement('div');
      desk.className='desk';
      desk.innerHTML='<div class="desk-head">Bancata '+(c+1)+'</div><div class="seats"></div>';
      const seats=desk.querySelector('.seats');

      for(let si=0;si<2;si++){
        const input=document.createElement('input');
        input.type='text';
        input.placeholder='Nome';
        input.value=state[di][si];
        input.autocomplete='off';
        input.addEventListener('input',()=>{state[di][si]=input.value});
        seats.appendChild(input);
      }
      row.appendChild(desk);
    }
    rows.appendChild(row);
  }
}

document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('Azzerare tutta la disposizione?')) return;
  for(let i=0;i<12;i++) state[i]=['',''];
  localStorage.removeItem('planner3bes-free');
  render();
};

document.getElementById('saveBtn').onclick=()=>{
  localStorage.setItem('planner3bes-free',JSON.stringify(state));
  const btn=document.getElementById('saveBtn');
  const old=btn.textContent;
  btn.textContent='Salvato';
  setTimeout(()=>btn.textContent=old,1000);
};

document.getElementById('loadBtn').onclick=()=>{
  try{
    const saved=JSON.parse(localStorage.getItem('planner3bes-free'));
    if(Array.isArray(saved)&&saved.length===12){
      for(let i=0;i<12;i++) state[i]=Array.isArray(saved[i])?[saved[i][0]||'',saved[i][1]||'']:['',''];
      render();
    }
  }catch(e){}
};

document.getElementById('imageBtn').onclick=async()=>{
  const target=document.querySelector('.classroom');
  const btn=document.getElementById('imageBtn');
  const old=btn.textContent;
  btn.textContent='Creo immagine...';
  btn.disabled=true;
  try{
    const canvas=await html2canvas(target,{backgroundColor:'#eef2f8',scale:2,useCORS:true});
    const a=document.createElement('a');
    a.download='banchi-3bes.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
  }catch(e){
    alert("Non sono riuscito a creare l'immagine.");
  }
  btn.textContent=old;
  btn.disabled=false;
};

render();
</script>
</body>
</html>
